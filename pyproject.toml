[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-169"
version = "0.1.0"
description = "水准测量网平差"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
level-network = "level_network.cli:main"
level-monitor = "level_network.monitor_cli:main"
level-plan = "level_network.plan_cli:main"
level-resilience = "level_network.resilience_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
